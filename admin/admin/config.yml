backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "listings"
    label: "Property Listings"
    label_singular: "Property"
    folder: "/"
    files:
      - name: "listings"
        label: "All Properties"
        file: "listings.json"
        fields:
          - { name: "id", label: "ID", widget: "number", default: 1 }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "price", label: "Price", widget: "string" }
          - { name: "location", label: "Location", widget: "string" }
          - { name: "bedrooms", label: "Bedrooms", widget: "number" }
          - { name: "bathrooms", label: "Bathrooms", widget: "number" }
          - { name: "sqft", label: "Square Feet", widget: "string" }
          - { name: "image", label: "Main Image", widget: "image" }
          - { name: "gallery", label: "Inside Tour Gallery", widget: "list", field: { name: "image", label: "Image", widget: "image" } }
          - { name: "status", label: "Status", widget: "select", options: ["available", "sold"], default: "available" }
          - { name: "description", label: "Description", widget: "text" }
