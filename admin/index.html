<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alexis Impact Realty - Admin</title>
</head>
<body>
  <script>
    // Force the CMS to use the correct identity endpoint
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Initialize Decap CMS with explicit identity configuration
    DecapCMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main',
          // Force the identity endpoint to use your site's URL
          identity_url: window.location.origin + '/.netlify/identity',
          gateway_url: window.location.origin + '/.netlify/git',
        },
        media_folder: 'images/uploads',
        public_folder: '/images/uploads',
        collections: [
          {
            name: 'listings',
            label: 'Property Listings',
            label_singular: 'Property',
            folder: '/',
            files: [
              {
                name: 'listings',
                label: 'All Properties',
                file: 'listings.json',
                fields: [
                  { name: 'id', label: 'ID', widget: 'number', default: 1 },
                  { name: 'title', label: 'Title', widget: 'string' },
                  { name: 'price', label: 'Price', widget: 'string' },
                  { name: 'location', label: 'Location', widget: 'string' },
                  { name: 'bedrooms', label: 'Bedrooms', widget: 'number' },
                  { name: 'bathrooms', label: 'Bathrooms', widget: 'number' },
                  { name: 'sqft', label: 'Square Feet', widget: 'string' },
                  { name: 'image', label: 'Main Image', widget: 'image' },
                  { 
                    name: 'gallery', 
                    label: 'Inside Tour Gallery', 
                    widget: 'list', 
                    field: { name: 'image', label: 'Image', widget: 'image' } 
                  },
                  { 
                    name: 'status', 
                    label: 'Status', 
                    widget: 'select', 
                    options: ['available', 'sold'], 
                    default: 'available' 
                  },
                  { name: 'description', label: 'Description', widget: 'text' }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
