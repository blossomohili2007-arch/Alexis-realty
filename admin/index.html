<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Alexis Impact Realty</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #FCF9F5; }
        .login-container { max-width: 400px; margin: 100px auto; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); text-align: center; }
        .login-container h1 { font-size: 1.8rem; color: #1C1C1E; margin-bottom: 8px; }
        .login-container h1 span { color: #C8A254; }
        .login-container p { color: #5A5A5E; margin-bottom: 30px; }
        input[type="password"] { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; margin-bottom: 16px; }
        .btn { background: #C8A254; color: white; padding: 16px 40px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; width: 100%; }
        .btn:hover { background: #A8873D; transform: translateY(-2px); }
        .error { color: #e74c3c; margin-top: 12px; display: none; }
        .hidden { display: none; }
        .dashboard { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
        .dashboard-header h2 { font-family: 'Playfair Display', serif; font-size: 2rem; }
        .add-btn { background: #C8A254; color: white; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .add-btn:hover { background: #A8873D; transform: translateY(-2px); }
        .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .property-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(200, 162, 84, 0.1); }
        .property-card img { width: 100%; height: 200px; object-fit: cover; }
        .property-card .info { padding: 16px; }
        .property-card .info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .property-card .info .price { color: #C8A254; font-weight: 700; font-size: 1.2rem; }
        .property-card .info .location { color: #5A5A5E; font-size: 0.9rem; }
        .property-card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .property-card .actions button { padding: 6px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.3s; }
        .edit-btn { background: #C8A254; color: white; }
        .edit-btn:hover { background: #A8873D; }
        .delete-btn { background: #e74c3c; color: white; }
        .delete-btn:hover { background: #c0392b; }
        .sold-badge { background: #e74c3c; color: white; padding: 2px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; display: inline-block; margin-left: 8px; }
        .available-badge { background: #27ae60; color: white; padding: 2px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; display: inline-block; margin-left: 8px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 32px; border-radius: 20px; max-width: 600px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .modal-content textarea { min-height: 80px; }
        .modal-content .btn { width: auto; padding: 12px 32px; }
        .modal-close { float: right; font-size: 2rem; cursor: pointer; color: #999; background: none; border: none; }
        .modal-close:hover { color: #333; }
        @media (max-width: 768px) { .dashboard-header { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>

    <!-- ========== LOGIN SCREEN ========== -->
    <div id="loginScreen" class="login-container">
        <h1>ALEXIS IMPACT <span>REALTY</span></h1>
        <p>Enter admin password to manage properties</p>
        <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="btn" onclick="checkPassword()">Access Dashboard</button>
        <div id="errorMsg" class="error">❌ Incorrect password. Try again.</div>
    </div>

    <!-- ========== DASHBOARD ========== -->
    <div id="dashboard" class="dashboard hidden">
        <div class="dashboard-header">
            <h2>🏠 Property Manager</h2>
            <button class="add-btn" onclick="openAddModal()">+ Add New Property</button>
        </div>
        <div id="propertyGrid" class="property-grid"></div>
    </div>

    <!-- ========== ADD/EDIT MODAL ========== -->
    <div id="propertyModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">Add Property</h2>
            <input type="text" id="propTitle" placeholder="Title (e.g., Modern Villa in Maitama)">
            <input type="text" id="propPrice" placeholder="Price (e.g., ₦450,000,000)">
            <input type="text" id="propLocation" placeholder="Location (e.g., 12 Lake Chad Crescent, Maitama)">
            <input type="number" id="propBedrooms" placeholder="Bedrooms">
            <input type="number" id="propBathrooms" placeholder="Bathrooms">
            <input type="text" id="propSqft" placeholder="Square Feet (e.g., 4,200)">
            <input type="text" id="propImage" placeholder="Main Image URL (e.g., https://...jpg)">
            <input type="text" id="propGallery" placeholder="Gallery Images (comma separated URLs)">
            <select id="propStatus">
                <option value="available">Available</option>
                <option value="sold">Sold</option>
            </select>
            <textarea id="propDescription" placeholder="Description"></textarea>
            <button class="btn" onclick="saveProperty()">Save Property</button>
        </div>
    </div>

    <script>
        // =========================================
        // THE PASSWORD - Change this to whatever you want!
        // =========================================
        const ADMIN_PASSWORD = "alexis2026";
        // =========================================

        let currentEditId = null;

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('errorMsg');
            if (input.value === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').classList.remove('hidden');
                loadProperties();
            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }

        function loadProperties() {
            fetch('listings.json')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('propertyGrid');
                    grid.innerHTML = data.map((item, index) => `
                        <div class="property-card">
                            <img src="${item.image}" alt="${item.title}">
                            <div class="info">
                                <h3>${item.title} <span class="${item.status === 'sold' ? 'sold-badge' : 'available-badge'}">${item.status.toUpperCase()}</span></h3>
                                <div class="price">${item.price}</div>
                                <div class="location">${item.location}</div>
                                <div style="font-size:0.85rem; color:#5A5A5E; margin-top:4px;">
                                    🛏 ${item.bedrooms} · 🛁 ${item.bathrooms} · 📐 ${item.sqft} sqft
                                </div>
                                <div class="actions">
                                    <button class="edit-btn" onclick="editProperty(${index})">✏️ Edit</button>
                                    <button class="delete-btn" onclick="deleteProperty(${index})">🗑️ Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('propertyGrid').innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:60px; color:#5A5A5E;">
                            <p>No properties found. Click "Add New Property" to get started.</p>
                            <p style="font-size:0.85rem; margin-top:8px;">Make sure <strong>listings.json</strong> exists in your repository.</p>
                        </div>
                    `;
                });
        }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Add New Property';
            document.getElementById('propTitle').value = '';
            document.getElementById('propPrice').value = '';
            document.getElementById('propLocation').value = '';
            document.getElementById('propBedrooms').value = '';
            document.getElementById('propBathrooms').value = '';
            document.getElementById('propSqft').value = '';
            document.getElementById('propImage').value = '';
            document.getElementById('propGallery').value = '';
            document.getElementById('propStatus').value = 'available';
            document.getElementById('propDescription').value = '';
            document.getElementById('propertyModal').classList.add('open');
        }

        function editProperty(index) {
            fetch('listings.json')
                .then(res => res.json())
                .then(data => {
                    const item = data[index];
                    currentEditId = index;
                    document.getElementById('modalTitle').textContent = 'Edit Property';
                    document.getElementById('propTitle').value = item.title || '';
                    document.getElementById('propPrice').value = item.price || '';
                    document.getElementById('propLocation').value = item.location || '';
                    document.getElementById('propBedrooms').value = item.bedrooms || '';
                    document.getElementById('propBathrooms').value = item.bathrooms || '';
                    document.getElementById('propSqft').value = item.sqft || '';
                    document.getElementById('propImage').value = item.image || '';
                    document.getElementById('propGallery').value = (item.gallery || []).join(', ');
                    document.getElementById('propStatus').value = item.status || 'available';
                    document.getElementById('propDescription').value = item.description || '';
                    document.getElementById('propertyModal').classList.add('open');
                });
        }

        function closeModal() {
            document.getElementById('propertyModal').classList.remove('open');
        }

        function saveProperty() {
            const newProperty = {
                id: Date.now(),
                title: document.getElementById('propTitle').value || 'Untitled Property',
                price: document.getElementById('propPrice').value || '₦0',
                location: document.getElementById('propLocation').value || 'Abuja, Nigeria',
                bedrooms: parseInt(document.getElementById('propBedrooms').value) || 0,
                bathrooms: parseInt(document.getElementById('propBathrooms').value) || 0,
                sqft: document.getElementById('propSqft').value || '0',
                image: document.getElementById('propImage').value || 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600&q=80',
                gallery: document.getElementById('propGallery').value.split(',').map(s => s.trim()).filter(s => s),
                status: document.getElementById('propStatus').value || 'available',
                description: document.getElementById('propDescription').value || 'A beautiful property in Abuja.'
            };

            fetch('listings.json')
                .then(res => res.json())
                .then(data => {
                    if (currentEditId !== null && currentEditId < data.length) {
                        // Edit existing
                        data[currentEditId] = { ...data[currentEditId], ...newProperty };
                        // Preserve the original ID
                        data[currentEditId].id = data[currentEditId].id || Date.now();
                    } else {
                        // Add new
                        data.push(newProperty);
                    }
                    
                    // Save back to listings.json
                    return fetch('listings.json', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data, null, 2)
                    });
                })
                .then(() => {
                    closeModal();
                    loadProperties();
                    alert('✅ Property saved successfully!');
                })
                .catch(err => {
                    alert('❌ Error saving. Make sure you have write permissions to listings.json.');
                    console.error(err);
                });
        }

        function deleteProperty(index) {
            if (!confirm('Are you sure you want to delete this property?')) return;
            
            fetch('listings.json')
                .then(res => res.json())
                .then(data => {
                    data.splice(index, 1);
                    return fetch('listings.json', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data, null, 2)
                    });
                })
                .then(() => {
                    loadProperties();
                    alert('✅ Property deleted!');
                })
                .catch(err => {
                    alert('❌ Error deleting. Make sure you have write permissions.');
                    console.error(err);
                });
        }

        // Close modal on outside click
        document.getElementById('propertyModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Load properties if already logged in
        if (document.getElementById('dashboard').classList.contains('hidden') === false) {
            loadProperties();
        }
    </script>

</body>
</html>
